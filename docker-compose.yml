version: "3.8"

services:
  funnelai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: funnel-ai-studio
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEXT_PUBLIC_GEMINI_API_KEY=${NEXT_PUBLIC_GEMINI_API_KEY}
      - APP_URL=${APP_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health | grep operational || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
